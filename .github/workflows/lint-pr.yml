name: Lint Wiki (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint wiki
        run: python3 .claude/skills/lint/scripts/lint_wiki.py

      - name: Test scripts
        run: python3 -m unittest discover -s tests -v

      - name: Check Pinga-Fogo quotes and embeds
        run: python3 scripts/pinga_fogo.py checar
